name: Cleanup stale branches

on:
  schedule:
    # Weekly, Mondays 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: fpicalausa/remove-stale-branches@v2
        with:
          dry-run: false
          days-before-branch-stale: 60
          days-before-branch-delete: 30
          exempt-branches-regex: '^(main|master|develop|release/.*|hotfix/.*)$'
          exempt-protected-branches: true
          ignore-unknown-authors: true
          stale-branch-message: |
            This branch has been inactive for {DAYS} days. It will be deleted
            in {DAYS_TO_DELETE} days unless there's new activity.
            If this branch is still needed, push a commit or open a PR.
