[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orobot"
version = "0.0.1"
description = "Python SDK for orobot.io — connect to robots, record teleoperation sessions, and export imitation-learning datasets from a notebook."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "See orobot-firmware repository" }
authors = [{ name = "orobot.io" }]
keywords = ["robotics", "imitation-learning", "lerobot", "teleoperation", "so-101"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Intentionally zero hard dependencies: the recording/REST core uses only the
# Python standard library so `pip install orobot` is light enough to run in a
# bare Colab kernel. The LeRobotDataset export path pulls in heavyweight,
# fast-moving deps (datasets, pyarrow, lerobot), so they live behind an
# optional extra and are imported lazily — see orobot.export.
dependencies = []

[project.optional-dependencies]
lerobot = ["lerobot>=0.1.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://orobot.io"
Repository = "https://github.com/lutherism/orobot-firmware"
Issues = "https://github.com/lutherism/orobotio/issues"

[tool.hatch.build.targets.wheel]
packages = ["orobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
